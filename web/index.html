<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Locora real-time location tracking.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Locora">
  <meta name="theme-color" content="#f4f9fb">
  <link rel="apple-touch-icon" href="icons/target.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/target.svg">

  <title>locora</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #loading-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      background: #f4f9fb;
      color: #123047;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      transition: opacity 240ms ease, visibility 240ms ease;
    }

    #loading-splash img {
      width: 64px;
      height: 64px;
      animation: target-arrive 700ms cubic-bezier(.2, .8, .2, 1) both;
    }

    #loading-splash strong {
      font-size: 23px;
      font-weight: 650;
    }

    #loading-splash .loading-line {
      width: 48px;
      height: 3px;
      overflow: hidden;
      border-radius: 2px;
      background: #d7e7ed;
    }

    #loading-splash .loading-line::after {
      display: block;
      width: 55%;
      height: 100%;
      border-radius: inherit;
      background: #0284c7;
      content: "";
      animation: loading-progress 1.1s ease-in-out infinite;
    }

    #loading-splash.loaded {
      visibility: hidden;
      opacity: 0;
    }

    @keyframes target-arrive {
      from { opacity: 0; transform: scale(.82); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes loading-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(190%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-splash,
      #loading-splash img,
      #loading-splash .loading-line::after {
        animation: none;
        transition: none;
      }
    }
  </style>
  <div id="loading-splash" role="status" aria-label="Loading Locora">
    <img src="icons/target.svg" alt="">
    <strong>locora</strong>
    <span class="loading-line" aria-hidden="true"></span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('loading-splash')?.classList.add('loaded');
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
